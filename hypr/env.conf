# . . . [envionment variables] . . . #

env = QT_QPA_PLATFORMTHEME,qt6ct # qt apps use qt6ct for theme

env = MOZ_ENABLE_WAYLAND,1 # force firefox to run on waylaynd
env = ELECTRON_OZONE_PLATFORM_HINT,auto # force electron apps to run on wayland

# {cursor} #

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24
