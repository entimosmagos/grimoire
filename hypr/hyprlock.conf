background {
    monitor =
    path = /home/magos/Pictures/wallpaper/purp.jpg
    blur_passes = 2
    blur_size = 5
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(180, 140, 255, 0.5)
    inner_color = rgba(15, 10, 25, 0.8)
    font_color = rgba(203, 166, 247, 1.0)
    placeholder_text = <i>password...</i>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(226, 208, 255, 1.0)
    font_size = 64
    font_family = FantasqueSansM Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
