# . . . [rules] . . . #

# prevent windows maximizing themselves #

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# xwalyand window drag bug fix #

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# imv always launch floating

windowrule {
    name = float-imv
    match:class = imv
    float = yes
    size = 1200 800
    center = yes
}
